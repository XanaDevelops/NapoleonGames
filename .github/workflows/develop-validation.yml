name: Develop Validation

on:
  pull_request:
    branches: [dev]

jobs:
  validate-develop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend verify
        working-directory: backend
        run: mvn clean verify

      - name: Validate docker compose
        run: docker compose config

      - name: Start backend + db
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              echo "Backend OK"
              exit 0
            fi
            echo "Esperando backend... intento $i"
            sleep 5
          done
          echo "Backend no respondió a tiempo"
          exit 1

      - name: Godot smoke check
        working-directory: godot
        run: |
          echo "Aquí va el headless check/export de Godot"

      - name: Shutdown
        if: always()
        run: docker compose down -v