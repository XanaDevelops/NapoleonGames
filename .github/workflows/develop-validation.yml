name: Develop Validation

on:
  pull_request:
    branches: [dev]

jobs:
  validate-develop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend verify
        working-directory: backend
        run: mvn clean verify

      - name: Detect docker compose file
        id: compose
        run: |
          if [ -f docker-compose.yml ]; then
            echo "file=docker-compose.yml" >> $GITHUB_OUTPUT
          elif [ -f compose.yml ]; then
            echo "file=compose.yml" >> $GITHUB_OUTPUT
          else
            echo "file=" >> $GITHUB_OUTPUT
          fi

      - name: Validate docker compose
        if: ${{ steps.compose.outputs.file != '' }}
        run: docker compose -f "${{ steps.compose.outputs.file }}" config

      - name: Docker compose skipped
        if: ${{ steps.compose.outputs.file == '' }}
        run: echo "No hay docker-compose.yml ni compose.yml; se omiten los pasos de compose"

      - name: Start backend + db
        if: ${{ steps.compose.outputs.file != '' }}
        run: docker compose -f "${{ steps.compose.outputs.file }}" up -d --build

      - name: Wait for backend
        if: ${{ steps.compose.outputs.file != '' }}
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              echo "Backend OK"
              exit 0
            fi
            echo "Esperando backend... intento $i"
            sleep 5
          done
          echo "Backend no respondió a tiempo"
          exit 1

      - name: Godot smoke check
        working-directory: godot
        run: |
          # Instala Godot (headless) usando la acción de game-ci y ejecuta GUT
      - name: Setup Godot (headless)
        uses: abarichello/godot-ci@4.6.1-stable
        with:
          version: '4.6.1'

      - name: Run GUT (headless)
        working-directory: godot
        run: |
          # Directorio para resultados de pruebas
          mkdir -p test_results
          # Ejecuta GUT en modo headless, exporta JUnit a test_results/gut-results.xml
          godot --headless --path . --script addons/gut/gut_cmdln.gd -- -gexit -gjunit_xml_file=test_results/gut-results.xml

      - name: Shutdown
        if: ${{ always() && steps.compose.outputs.file != '' }}
        run: docker compose -f "${{ steps.compose.outputs.file }}" down -v