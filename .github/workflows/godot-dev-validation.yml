name: Godot Dev Validation

on:
  pull_request:
    branches: [dev]

env:
  GODOT_VERSION: 4.6.1
  PROJECT_PATH: godot
  
jobs:
  validate-godot:
    runs-on: ubuntu-latest
    # Usaremos Docker manualmente para poder cachear la imagen entre ejecuciones

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore docker image cache
        id: cache-docker-image
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-ci-image
          key: ${{ runner.os }}-godot-image-${{ env.GODOT_VERSION }}

      - name: Ensure Docker image loaded
        run: |
          IMAGE=barichello/godot-ci:${{ env.GODOT_VERSION }}
          CACHE_DIR=~/.cache/godot-ci-image
          mkdir -p "$CACHE_DIR"
          if [ -f "$CACHE_DIR/godot-image.tar" ]; then
            echo "Loading docker image from cache"
            docker load -i "$CACHE_DIR/godot-image.tar"
          else
            echo "Pulling docker image $IMAGE"
            docker pull "$IMAGE"
            echo "Saving docker image to cache"
            docker save "$IMAGE" -o "$CACHE_DIR/godot-image.tar"
          fi

      - name: Cache Godot export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
            ~/.config/godot
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Note about export templates
        run: |
          echo "Using the cached/loaded 'barichello/godot-ci:${{ env.GODOT_VERSION }}' image; export templates are provided inside the image." 

      - name: Verify committed class registry
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          if [ -f .godot/global_script_class_cache.cfg ]; then
            echo ".godot/global_script_class_cache.cfg found"
            head -n 10 .godot/global_script_class_cache.cfg || true
          else
            echo "Warning: .godot/global_script_class_cache.cfg not found in repo. Import will be attempted."
          fi

      - name: Import Godot resources (headless) via docker
        run: |
          echo "Importando recursos de Godot dentro del contenedor..."
          IMAGE=barichello/godot-ci:${{ env.GODOT_VERSION }}
          timeout 60s docker run --rm -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/${{ env.PROJECT_PATH }}" "$IMAGE" bash -lc "godot --headless --path . --import --quit" || echo "Import exited (timeout or non-zero exit)"
          if [ -f $GITHUB_WORKSPACE/${{ env.PROJECT_PATH }}/.godot/global_script_class_cache.cfg ]; then
            echo "Class registry present after import"
          else
            echo "No class registry generated after import"
          fi

      - name: Run GUT (headless) via docker
        run: |
          IMAGE=barichello/godot-ci:${{ env.GODOT_VERSION }}
          mkdir -p $GITHUB_WORKSPACE/${{ env.PROJECT_PATH }}/test/xml_out
          set +e
          timeout 60s docker run --rm -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/${{ env.PROJECT_PATH }}" -e GODOT_LOG_LEVEL=warn -e GODOT_DISABLE_DEPRECATED_WARNINGS=1 "$IMAGE" bash -lc "godot --headless --path . --script addons/gut/gut_cmdln.gd -- -gconfig=.gutconfig.json -gexit -gjunit_xml_file=test/xml_out/gut-results.xml"
          exit_code=$?
          set -e
          echo "GUT exit code: $exit_code"
          if [ $exit_code -ne 0 ]; then
            echo "❌ GUT reported failures"
            exit $exit_code
          fi

      - name: Upload GUT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-results
          path: ${{ env.PROJECT_PATH }}/test/xml_out/gut-results.xml
