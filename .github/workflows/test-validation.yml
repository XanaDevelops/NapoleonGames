name: Test Validation

on:
  pull_request:
    branches: [test]

jobs:
  validate-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit ancestry against develop
        run: bash scripts/check_commit_ancestry.sh "${{ github.event.pull_request.head.sha }}" develop

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests with coverage
        working-directory: backend
        run: mvn clean verify jacoco:report

      - name: Enforce coverage >= 70%
        working-directory: backend
        run: |
          COVERAGE=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          c = [x for x in root.findall('counter') if x.attrib['type']=='LINE'][0]
          missed = int(c.attrib['missed']); covered = int(c.attrib['covered'])
          print(covered * 100 / (missed + covered))
          PY
          )
          echo "Coverage: $COVERAGE"
          awk "BEGIN {exit !($COVERAGE >= 70)}"

      - name: SonarQube
        working-directory: backend
        run: mvn sonar:sonar \
          -Dsonar.projectKey=napoleon-games \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Start backend + db
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/actuator/health; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Godot smoke check
        working-directory: frontend
        run: |
          echo "Aquí va el headless check/export de Godot"

      - name: Shutdown
        if: always()
        run: docker compose down -v