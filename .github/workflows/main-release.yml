name: Main Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend verify
        working-directory: backend
        run: mvn clean verify

      - name: Build backend image
        working-directory: backend
        run: docker build -t napoleon-backend:latest .

      - name: Push backend image
        run: |
          echo "docker login + docker push"

      - name: Deploy backend
        run: |
          echo "deploy a VPS o Render"

      - name: Godot production export
        working-directory: godot
        run: |
          echo "export final Godot headless"

      - name: Publish Itch / Steam
        run: |
          echo "butler o SteamPipe"

      - name: Stable tag
        run: |
          VERSION=$(date +%Y.%m.%d)-${GITHUB_SHA::7}
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} ya existe"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi